<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0d18; overflow: hidden; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 48px; }
  .text { color: #fff; font-size: 76px; font-weight: 800; letter-spacing: -0.02em; text-align: center; line-height: 1.25; opacity: 0; animation: fadein 0.6s ease-out 0.2s forwards; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .em { color: #ef4444; }
  .reason { color: #8a92a8; font-size: 22px; font-weight: 500; text-align: center; margin-top: 36px; line-height: 1.7; opacity: 0; animation: fadein 0.6s ease-out 1.2s forwards; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="text">但说不上<br><span class="em">哪里</span>不会</div>
    <div class="reason">家长焦虑 · 老师翻课标<br>学生卡题海<br><span style="color:#5a6278;">—— 没人能告诉"之前漏了哪一步"</span></div>
  </div>
</div>
</body>
</html>
