<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0d18; overflow: hidden; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 48px; }
  .text { color: #fff; font-size: 90px; font-weight: 800; letter-spacing: -0.02em; text-align: center; line-height: 1.2; opacity: 0; animation: fadein 0.8s ease-out 0.3s forwards; }
  @keyframes fadein { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .sub { color: #8a92a8; font-size: 24px; font-weight: 500; text-align: center; margin-top: 28px; line-height: 1.5; opacity: 0; animation: fadein 0.8s ease-out 1.2s forwards; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="text">孩子说<br>不会</div>
    <div class="sub">（1.6 亿 K12 学生<br>每天 2 亿次这样的时刻）</div>
  </div>
</div>
</body>
</html>
