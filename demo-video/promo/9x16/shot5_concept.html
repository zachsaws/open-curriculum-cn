<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: radial-gradient(ellipse at center, #1a2040 0%, #0a0d18 70%); overflow: hidden; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative; }
  .label { color: #8a92a8; font-size: 17px; font-weight: 500; margin-top: 56px; margin-bottom: 8px; opacity: 0; animation: fadein 0.4s ease-out 0.2s forwards; z-index: 2; padding: 0 32px; text-align: center; }
  .label .b { color: #6b8cff; font-weight: 800; }
  .label .r { color: #ef4444; font-weight: 800; }
  svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  .pre { opacity: 0; animation: fadein 0.3s ease-out forwards; }
  .target { opacity: 0; animation: pop 0.4s cubic-bezier(.2,1.5,.3,1) 1.4s forwards; }
  .arrow { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 0.3s ease-out forwards; }
  .arrow-1 { animation-delay: 0.6s; }
  .arrow-2 { animation-delay: 0.75s; }
  .arrow-3 { animation-delay: 0.9s; }
  .arrow-4 { animation-delay: 1.05s; }
  .arrow-5 { animation-delay: 1.2s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">点 <span class="b">任意概念</span> → BFS 反向追溯 <span class="r">所有之前要学的</span></div>
  <svg viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid meet">
    <!-- 5 个前置概念 (左侧, 垂直堆叠) -->
    <g class="pre" style="animation-delay:0.5s">
      <circle cx="100" cy="320" r="22" fill="#5b8def" opacity="0.9"/>
      <text x="100" y="326" fill="#fff" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="middle">1</text>
      <text x="160" y="320" fill="#fff" font-size="18" text-anchor="start" font-weight="600" dominant-baseline="middle">一元一次方程</text>
    </g>
    <g class="pre" style="animation-delay:0.65s">
      <circle cx="100" cy="450" r="22" fill="#5b8def" opacity="0.9"/>
      <text x="100" y="456" fill="#fff" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="middle">2</text>
      <text x="160" y="450" fill="#fff" font-size="18" text-anchor="start" font-weight="600" dominant-baseline="middle">乘法分配律</text>
    </g>
    <g class="pre" style="animation-delay:0.8s">
      <circle cx="100" cy="580" r="22" fill="#5b8def" opacity="0.9"/>
      <text x="100" y="586" fill="#fff" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="middle">3</text>
      <text x="160" y="580" fill="#fff" font-size="18" text-anchor="start" font-weight="600" dominant-baseline="middle">分数加减法</text>
    </g>
    <g class="pre" style="animation-delay:0.95s">
      <circle cx="100" cy="710" r="22" fill="#5b8def" opacity="0.9"/>
      <text x="100" y="716" fill="#fff" font-size="14" text-anchor="middle" font-weight="700" dominant-baseline="middle">4</text>
      <text x="160" y="710" fill="#fff" font-size="18" text-anchor="start" font-weight="600" dominant-baseline="middle">正负数</text>
    </g>
    <g class="pre" style="animation-delay:1.1s">
      <circle cx="100" cy="840" r="20" fill="#a5b8f5" opacity="0.6"/>
      <text x="100" y="846" fill="#a5b8f5" font-size="13" text-anchor="middle" font-weight="700" dominant-baseline="middle">+</text>
      <text x="160" y="840" fill="#a5b8f5" font-size="18" text-anchor="start" font-weight="500" dominant-baseline="middle">19 个更多</text>
    </g>

    <!-- 箭头 (从左侧指向右侧 target) -->
    <line class="arrow arrow-1" x1="125" y1="320" x2="500" y2="800" stroke="#6b8cff" stroke-width="3" opacity="0.7"/>
    <line class="arrow arrow-2" x1="125" y1="450" x2="500" y2="800" stroke="#6b8cff" stroke-width="3" opacity="0.7"/>
    <line class="arrow arrow-3" x1="125" y1="580" x2="500" y2="800" stroke="#6b8cff" stroke-width="3" opacity="0.7"/>
    <line class="arrow arrow-4" x1="125" y1="710" x2="500" y2="800" stroke="#6b8cff" stroke-width="3" opacity="0.7"/>
    <line class="arrow arrow-5" x1="125" y1="840" x2="500" y2="800" stroke="#6b8cff" stroke-width="3" opacity="0.5" style="stroke-dasharray: 8 8;"/>

    <!-- 核心概念 (右侧, 大圆) -->
    <g class="target">
      <circle cx="560" cy="800" r="62" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
      <circle cx="560" cy="800" r="52" fill="#ef4444" opacity="0.9"/>
      <text x="560" y="800" fill="#fff" font-size="40" text-anchor="middle" font-weight="900" dominant-baseline="middle">∑</text>
      <text x="560" y="900" fill="#fff" font-size="20" text-anchor="middle" font-weight="800">一元二次方程</text>
      <text x="560" y="935" fill="#ef4444" font-size="14" text-anchor="middle" font-weight="600">← 你点这个</text>
    </g>
  </svg>
</div>
</body>
</html>
