<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: linear-gradient(135deg, #0a0d18 0%, #1a2040 100%); overflow: hidden; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 48px; }
  .text { color: #fff; font-size: 70px; font-weight: 800; letter-spacing: -0.02em; text-align: center; line-height: 1.3; opacity: 0; animation: rise 0.7s cubic-bezier(.2,.8,.2,1) 0.2s forwards; }
  .text2 { color: #6b8cff; font-size: 86px; font-weight: 900; letter-spacing: -0.02em; text-align: center; line-height: 1.3; margin-top: 18px; opacity: 0; animation: rise 0.7s cubic-bezier(.2,.8,.2,1) 0.6s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .dot { color: #6b8cff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="text">每一步学什么</div>
  <div class="text2">之前漏了<br><span class="dot">哪一步</span></div>
</div>
</body>
</html>
