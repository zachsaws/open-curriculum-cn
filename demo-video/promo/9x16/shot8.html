<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0d18; overflow: hidden; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 48px; }
  .h { color: #fff; font-size: 56px; font-weight: 800; margin-bottom: 56px; opacity: 0; animation: fadein 0.6s ease-out 0.2s forwards; }
  .list { display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .row { font-size: 38px; font-weight: 700; color: #5a6278; text-decoration: line-through; opacity: 0; animation: strike 0.4s ease-out forwards; padding: 4px 0; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes strike { 0% { opacity: 0; transform: translateX(-30px); color: #fff; } 100% { opacity: 1; transform: translateX(0); color: #5a6278; } }
  .ok { color: #fff; text-decoration: none; font-size: 28px; font-weight: 800; margin-top: 36px; line-height: 1.4; text-align: center; opacity: 0; animation: pop 0.5s cubic-bezier(.2,1.5,.3,1) 2.4s forwards; max-width: 560px; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="h">我们不做</div>
  <div class="list">
    <div class="row" style="animation-delay:0.5s">不是题库</div>
    <div class="row" style="animation-delay:0.8s">不是网课</div>
    <div class="row" style="animation-delay:1.1s">不是 AI 老师</div>
    <div class="row" style="animation-delay:1.4s">不是学习机</div>
  </div>
  <div class="ok">就是一份<br>「学之前要会什么 / 学之后能学什么」<br>的图谱</div>
</div>
</body>
</html>
