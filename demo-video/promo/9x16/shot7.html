<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0d18; overflow: hidden; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .card { width: 600px; background: rgba(255,255,255,0.04); border: 1px solid rgba(107,140,255,0.3); border-radius: 24px; padding: 50px 40px; display: flex; flex-direction: column; align-items: center; gap: 32px; opacity: 0; animation: pop 0.4s cubic-bezier(.2,1.5,.3,1) forwards; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
  .emoji { font-size: 140px; line-height: 1; }
  .h { color: #fff; font-size: 44px; font-weight: 800; line-height: 1.3; text-align: center; }
  .s { color: #a5b8f5; font-size: 24px; font-weight: 500; line-height: 1.5; text-align: center; }
  .arrow { color: #6b8cff; font-size: 22px; font-weight: 700; margin-top: 4px; }
  .counter { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); color: #5a6278; font-size: 16px; font-weight: 600; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5a6278; margin: 0 4px; }
  .dot.on { background: #6b8cff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="emoji">🆘</div>
    <div>
      <div class="h">孩子卡在某个知识点</div>
      <div class="s">看看之前漏了哪一步</div>
      <div class="arrow">→ 之前要学的 23 个</div>
    </div>
  </div>
  <div class="counter">
    <span class="dot on" id="d0"></span>
    <span class="dot" id="d1"></span>
    <span class="dot" id="d2"></span>
    <span class="dot" id="d3"></span>
  </div>
</div>
<script>
  const cards = [
    { em: '🆘', h: '孩子卡在某个知识点', s: '看看之前漏了哪一步', a: '→ 之前要学的 23 个' },
    { em: '📖', h: '老师备课', s: '翻完整的学习路径', a: '→ 之前要学的 1-N 个' },
    { em: '🧒', h: '学生想提前学', s: '一眼看到先后顺序', a: '→ 之前要学的 1-N 个' },
    { em: '🔗', h: '找学科之间的连接', s: '看到概念之间怎么连', a: '→ 跨学科 2613 条' },
  ];
  const wrap = document.querySelector('.wrap');
  let i = 0;
  const updateDots = () => {
    for (let j = 0; j < 4; j++) {
      const d = document.getElementById('d' + j);
      if (d) d.className = (j === i ? 'dot on' : 'dot');
    }
  };
  const showNext = () => {
    if (i >= cards.length) return;
    const card = document.getElementById('card');
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'pop 0.4s cubic-bezier(.2,1.5,.3,1) forwards';
    card.innerHTML = `
      <div class="emoji">${cards[i].em}</div>
      <div>
        <div class="h">${cards[i].h}</div>
        <div class="s">${cards[i].s}</div>
        <div class="arrow">${cards[i].a}</div>
      </div>
    `;
    updateDots();
    i++;
    setTimeout(showNext, 700);
  };
  setTimeout(showNext, 100);
</script>
</body>
</html>
