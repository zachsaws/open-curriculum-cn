<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: radial-gradient(ellipse at center, #1a2040 0%, #0a0d18 70%); overflow: hidden; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative; }
  .label { color: #8a92a8; font-size: 18px; font-weight: 500; margin-top: 56px; margin-bottom: 12px; opacity: 0; animation: fadein 0.4s ease-out 0.2s forwards; }
  .label .b { color: #fff; font-weight: 800; }
  svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  .row { opacity: 0; animation: fadein 0.4s ease-out forwards; }
  .row-1 { animation-delay: 0.5s; }
  .row-2 { animation-delay: 0.8s; }
  .row-3 { animation-delay: 1.1s; }
  .row-4 { animation-delay: 1.4s; }
  .conn { stroke-dasharray: 800; stroke-dashoffset: 800; animation: draw 1s ease-out forwards; }
  .conn-1 { animation-delay: 1.8s; }
  .conn-2 { animation-delay: 2.0s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">漏斗形 <span class="b">学习路径</span> · 1-9 年级 1906 概念</div>
  <svg viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid meet">
    <!-- 4 段漏斗 (4 学段), 横向排, 越往下越宽 -->
    <!-- Row 1: 1-2 年级 (5 节点, 居中窄) -->
    <g class="row row-1">
      <circle cx="320" cy="380" r="9" fill="#5b8def" opacity="0.9"/>
      <circle cx="360" cy="380" r="9" fill="#5b8def" opacity="0.9"/>
      <circle cx="400" cy="380" r="9" fill="#5b8def" opacity="0.9"/>
      <circle cx="340" cy="420" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="380" cy="420" r="6" fill="#5b8def" opacity="0.7"/>
    </g>
    <!-- Row 2: 3-4 年级 (9 节点, 中等宽) -->
    <g class="row row-2">
      <circle cx="280" cy="560" r="8" fill="#5b8def" opacity="0.85"/>
      <circle cx="320" cy="560" r="8" fill="#5b8def" opacity="0.85"/>
      <circle cx="360" cy="560" r="8" fill="#5b8def" opacity="0.85"/>
      <circle cx="400" cy="560" r="8" fill="#5b8def" opacity="0.85"/>
      <circle cx="440" cy="560" r="8" fill="#5b8def" opacity="0.85"/>
      <circle cx="300" cy="600" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="340" cy="600" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="380" cy="600" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="420" cy="600" r="6" fill="#5b8def" opacity="0.7"/>
    </g>
    <!-- Row 3: 5-6 年级 (13 节点, 更宽) -->
    <g class="row row-3">
      <circle cx="200" cy="780" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="250" cy="780" r="8" fill="#5b8def" opacity="0.8"/>
      <circle cx="300" cy="780" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="350" cy="780" r="8" fill="#5b8def" opacity="0.8"/>
      <circle cx="400" cy="780" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="450" cy="780" r="8" fill="#5b8def" opacity="0.8"/>
      <circle cx="500" cy="780" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="220" cy="820" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="270" cy="820" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="320" cy="820" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="370" cy="820" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="420" cy="820" r="6" fill="#5b8def" opacity="0.7"/>
      <circle cx="470" cy="820" r="6" fill="#5b8def" opacity="0.7"/>
    </g>
    <!-- Row 4: 7-9 年级 (19 节点, 最宽 + 1 红高亮) -->
    <g class="row row-4">
      <circle cx="120" cy="1010" r="10" fill="#5b8def" opacity="0.9"/>
      <circle cx="170" cy="1010" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="220" cy="1010" r="10" fill="#5b8def" opacity="0.9"/>
      <circle cx="270" cy="1010" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="320" cy="1010" r="10" fill="#5b8def" opacity="0.9"/>
      <circle cx="370" cy="1010" r="13" fill="#ef4444" opacity="1"/>
      <circle cx="420" cy="1010" r="10" fill="#5b8def" opacity="0.9"/>
      <circle cx="470" cy="1010" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="520" cy="1010" r="10" fill="#5b8def" opacity="0.9"/>
      <circle cx="570" cy="1010" r="9" fill="#5b8def" opacity="0.85"/>
      <circle cx="140" cy="1050" r="7" fill="#5b8def" opacity="0.75"/>
      <circle cx="190" cy="1050" r="7" fill="#5b8def" opacity="0.75"/>
      <circle cx="240" cy="1050" r="8" fill="#5b8def" opacity="0.8"/>
      <circle cx="290" cy="1050" r="7" fill="#5b8def" opacity="0.75"/>
      <circle cx="340" cy="1050" r="8" fill="#5b8def" opacity="0.8"/>
      <circle cx="400" cy="1050" r="8" fill="#5b8def" opacity="0.8"/>
      <circle cx="450" cy="1050" r="7" fill="#5b8def" opacity="0.75"/>
      <circle cx="500" cy="1050" r="8" fill="#5b8def" opacity="0.8"/>
      <circle cx="550" cy="1050" r="7" fill="#5b8def" opacity="0.75"/>
    </g>

    <!-- 学段分隔线 -->
    <line class="conn conn-1" x1="60" y1="480" x2="660" y2="480" stroke="#6b8cff" stroke-width="1" opacity="0.4"/>
    <line class="conn conn-1" x1="60" y1="680" x2="660" y2="680" stroke="#6b8cff" stroke-width="1" opacity="0.4"/>
    <line class="conn conn-2" x1="60" y1="900" x2="660" y2="900" stroke="#6b8cff" stroke-width="1" opacity="0.4"/>

    <!-- 学段标签 (左侧) -->
    <text x="50" y="403" fill="#5a6278" font-size="14" text-anchor="end" font-weight="600">1-2</text>
    <text x="50" y="583" fill="#5a6278" font-size="14" text-anchor="end" font-weight="600">3-4</text>
    <text x="50" y="803" fill="#5a6278" font-size="14" text-anchor="end" font-weight="600">5-6</text>
    <text x="50" y="1033" fill="#5a6278" font-size="14" text-anchor="end" font-weight="600">7-9</text>

    <!-- 高亮节点标签 (红色节点下方) -->
    <text x="370" y="1100" fill="#fff" font-size="14" text-anchor="middle" font-weight="700" style="text-shadow: 0 0 8px #ef4444">一元二次方程</text>
  </svg>
</div>
</body>
</html>
