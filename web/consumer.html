<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="从一个知识点开始，看图理解，顺着联系继续探索。">
  <title>知识地图</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./consumer.css">
</head>
<body>
  <a class="skip" href="#learning-card">跳到当前知识点</a>
  <header class="topbar">
    <a class="brand" href="./consumer.html" aria-label="知识地图首页"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 8.5 14 4l9 4.5v11L14 24l-9-4.5zM5 8.5l9 4.5 9-4.5M14 13v11"/></svg><span>知识地图</span></a>
    <nav aria-label="主导航"><button class="nav-current" id="explore-button">探索</button><button id="saved-button">稍后再学</button></nav>
    <button class="search-button" id="search-button" aria-label="搜索知识点"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><span>找一个知识点</span><kbd>/</kbd></button>
  </header>
  <main class="desk" id="desk">
    <div class="desk-top"><button id="back-button" class="back-button" disabled>← 返回</button><span id="topic-context">数学</span><button id="notes-button" class="note-button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4H4v12h12V8M9 12l1-4 6-6 3 3-6 6z"/></svg>记笔记</button></div>
    <div class="board" id="board">
      <svg class="connections" id="connections" aria-hidden="true"></svg>
      <section class="related-column before" id="before-column" aria-label="相关知识"></section>
      <article class="learning-card loading" id="learning-card" tabindex="-1"><div class="placeholder title-placeholder"></div><div class="placeholder diagram-placeholder"></div><div class="placeholder text-placeholder"></div></article>
      <section class="related-column after" id="after-column" aria-label="继续探索"></section>
    </div>
    <footer class="desk-footer"><span>中国 K12 知识地图</span><button id="about-button">实验版 · 内容说明</button></footer>
  </main>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="dialog-head"><h2 id="search-title">找一个知识点</h2><button class="icon-button" data-close="search-dialog" aria-label="关闭搜索">×</button></div>
    <input id="search-input" type="search" aria-label="搜索知识点" placeholder="例如：分数、勾股定理" autocomplete="off">
    <div class="filter-row"><select id="subject-filter" aria-label="学科"><option value="">全部学科</option></select><select id="grade-filter" aria-label="年级"><option value="">全部年级</option></select></div>
    <div id="search-results" class="search-results"></div>
  </dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title">内容说明</h2><button class="icon-button" data-close="detail-dialog" aria-label="关闭内容说明">×</button></div><div id="detail-body"></div></dialog>
  <dialog id="notes-dialog" class="notes-dialog" aria-labelledby="notes-title"><div class="dialog-head"><h2 id="notes-title">我的笔记</h2><button class="icon-button" data-close="notes-dialog" aria-label="关闭笔记">×</button></div><p id="notes-concept"></p><textarea id="notes-input" aria-label="笔记内容" maxlength="6000" placeholder="记下自己的理解，或者一个还没想通的问题。"></textarea><div class="notes-footer"><span>保存在这台设备</span><button class="primary" id="save-notes">保存笔记</button></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>
  <noscript>请开启 JavaScript，或访问<a href="./index.html">原版知识地图</a>。</noscript>
  <script type="module" src="./consumer.mjs"></script>
</body>
</html>
