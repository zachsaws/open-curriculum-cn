<div class="legend" id="legend" role="group" aria-label="学科筛选"></div>

<div id="tip">
  <span class="sw" id="tip-sw"></span>
  <span class="ts" id="tip-ts"></span>
  <div class="ttl" id="tip-ttl"></div>
  <div class="q" id="tip-q"></div>
</div>

<div id="card" role="dialog" aria-modal="false" aria-label="概念详情" aria-hidden="true">
  <button class="back" id="card-back" aria-label="返回上一个概念">← 返回</button>
  <button class="close" aria-label="关闭详情面板">×</button>
  <div class="head">
    <span class="sw" id="card-sw"></span>
    <span class="cs" id="card-cs"></span>
  </div>
  <div class="ctl" id="card-ctl"></div>
  <div class="tag-row" id="card-tags"></div>

  <div class="card-actions">
    <a class="card-action" id="card-exercise-btn" target="_blank" title="做几道题 - 选择/填空/简答, 5 道题互补">📝 做几道题</a>
    <a class="card-action" id="card-diagnose-btn" target="_blank" title="智能诊断 - 5 题快速测出薄弱程度 + 复习路径">🩺 智能诊断</a>
    <a class="card-action" id="card-print-btn" target="_blank" title="打开 A4 黑白打印版">🖨 打印版</a>
    <a class="card-action" id="card-share-btn" href="javascript:void(0)" title="生成可分享的 1080×1440 学习卡">📤 分享学习卡</a>
  </div>

  <div class="lin-stats" id="card-lin-stats">
    <div class="row1">
      <div class="n" id="card-lin-n">0</div>
      <div class="u" id="card-lin-u">prerequisites in total</div>
    </div>
    <div class="sub" id="card-lin-sub">选中节点后, BFS 反向追溯所有直接 + 间接前置概念.</div>
  </div>

  <div class="block teaching-voice" id="card-teaching-voice-block">
    <div class="block-title">🎓 这步怎么教 <span style="font-weight:400; font-size:11px; color:#8a92a8; margin-left:6px;">老师口吻 · 3 句话讲明白</span></div>
    <div class="block-body" id="card-teaching-voice"></div>
  </div>

  <div class="block" id="card-content-req-block">
    <div class="block-title"><span data-i18n="card_content_req">📋 课标内容要求</span> <span class="num" id="card-page-link"></span></div>
    <div class="block-body" id="card-content-req"></div>
  </div>

  <div class="block" id="card-academic-req-block">
    <div class="block-title" data-i18n="card_academic_req">🎯 课标学业要求</div>
    <div class="block-body" id="card-academic-req"></div>
  </div>

  <div class="block" id="card-key-points-block">
    <div class="block-title" data-i18n="card_key_points">💡 知识要点</div>
    <div class="kp-list" id="card-key-points"></div>
  </div>
  <div class="block" id="card-real-examples-block" style="display:none">
    <div class="block-title">📖 真实课例</div>
    <div class="block-body" id="card-real-examples"></div>
  </div>
  <div class="block" id="card-common-mistakes-block" style="display:none">
    <div class="block-title">⚠️ 常见错误</div>
    <div class="block-body" id="card-common-mistakes"></div>
  </div>
  <div class="block" id="card-teaching-activity-block" style="display:none">
    <div class="block-title">🎲 教学活动</div>
    <div class="block-body" id="card-teaching-activity"></div>
  </div>

  <div class="block" id="card-examples-block" style="display:none">
    <div class="block-title" data-i18n="card_examples">📚 课标例题</div>
    <div class="ex-row" id="card-examples"></div>
  </div>

  <div class="block" id="card-assessment-block" style="display:none">
    <div class="block-title" data-i18n="card_assessment">🎯 评估提示</div>
    <div class="block-body" id="card-assessment"></div>
  </div>

  <div class="block" id="card-meta-block" style="display:none">
    <div class="meta-row" id="card-meta"></div>
  </div>

  <div class="sec sec-pre">
    <div class="label"><span data-i18n="card_prereq">先要会</span> · <span class="k" id="card-pre-k">0</span></div>
    <div class="rows" id="card-pre-rows"></div>
  </div>
  <div class="sec sec-next">
    <div class="label"><span data-i18n="card_unlocks">之后能学</span> · <span class="k" id="card-next-k">0</span></div>
    <div class="rows" id="card-next-rows"></div>
  </div>
</div>

<script src="./subject-cn.js"></script>
<script src="./share.js"></script>
<script src="./data-cache.js"></script>
<script src="./funnel.js"></script>
</body>
</html>
