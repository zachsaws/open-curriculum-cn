<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="中国基础教育（K12）知识图谱开源基础设施 - 概念依赖关系可视化">
<title>中国基础教育知识图谱 · Open Curriculum CN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0a0d18; color: #e6e9f2; }
  #wrap { position: fixed; inset: 0; cursor: grab; }
  #wrap.drag { cursor: grabbing; }
  #cv { display: block; width: 100%; height: 100%; }

  /* 头部 */
  .header {
    position: fixed; top: 0; left: 0; right: 0; padding: 20px 28px;
    z-index: 10; pointer-events: none;
    background: linear-gradient(180deg, rgba(10,13,24,0.95) 0%, rgba(10,13,24,0) 100%);
  }
  .header h1 {
    font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .header .sub { font-size: 12px; color: #8a92a8; }

  /* 统计 */
  .stats {
    position: fixed; top: 80px; right: 20px; z-index: 10;
    background: rgba(20, 24, 38, 0.85); backdrop-filter: blur(10px);
    padding: 10px 14px; border-radius: 8px; font-size: 12px;
    color: #8a92a8; line-height: 1.6;
  }
  .stats b { color: #e6e9f2; font-weight: 600; }

  /* 图例 */
  .legend {
    position: fixed; bottom: 20px; left: 20px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 6px;
    max-width: 60vw;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 14px;
    background: rgba(20, 24, 38, 0.7); backdrop-filter: blur(8px);
    font-size: 11px; cursor: pointer; user-select: none;
    border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.15s;
  }
  .chip:hover { background: rgba(40, 46, 68, 0.9); }
  .chip.off { opacity: 0.35; }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .chip .nm { color: #e6e9f2; }
  .chip .ct { color: #8a92a8; font-family: "SF Mono", monospace; font-size: 10px; }

  /* 提示卡 */
  #tip {
    position: fixed; z-index: 20; pointer-events: none;
    background: rgba(20, 24, 38, 0.95); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 12px 14px; max-width: 320px; font-size: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    opacity: 0; transition: opacity 0.15s;
  }
  #tip.on { opacity: 1; }
  #tip .sw { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #tip .ts { color: #8a92a8; font-size: 10px; font-family: "SF Mono", monospace; text-transform: uppercase; letter-spacing: 0.5px; }
  #tip .ttl { font-weight: 600; margin-top: 4px; line-height: 1.4; }
  #tip .q { margin-top: 6px; color: #b8c0d8; font-style: italic; line-height: 1.5; }

  /* 详情面板 */
  #card {
    position: fixed; right: 0; top: 0; bottom: 0; width: 380px;
    background: rgba(15, 18, 28, 0.96); backdrop-filter: blur(16px);
    border-left: 1px solid rgba(255,255,255,0.08);
    padding: 20px 24px; overflow-y: auto; z-index: 15;
    transform: translateX(100%); transition: transform 0.25s ease-out;
    display: flex; flex-direction: column; gap: 12px;
  }
  #card.on { transform: translateX(0); }
  #card .close { position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; border: none; background: transparent; color: #8a92a8; font-size: 18px; cursor: pointer; }
  #card .close:hover { color: #e6e9f2; }
  #card .head { display: flex; align-items: center; gap: 8px; padding-top: 8px; }
  #card .sw { width: 10px; height: 10px; border-radius: 50%; }
  #card .cs { font-size: 11px; color: #8a92a8; font-family: "SF Mono", monospace; text-transform: uppercase; letter-spacing: 0.5px; }
  #card .ctl { font-size: 20px; font-weight: 700; line-height: 1.3; margin-top: 4px; }
  #card .cq { color: #b8c0d8; font-style: italic; line-height: 1.5; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; }
  #card .count { font-size: 32px; font-weight: 700; line-height: 1; margin-top: 8px; }
  #card .count-unit { font-size: 12px; color: #8a92a8; margin-top: 4px; }
  #card .sub { font-size: 12px; color: #8a92a8; line-height: 1.5; }
  #card .sec { margin-top: 12px; }
  #card .sec .label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8a92a8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  #card .sec .k { font-family: "SF Mono", monospace; color: #e6e9f2; }
  #card .rows { display: flex; flex-direction: column; gap: 4px; }
  #card .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; cursor: pointer; text-align: left; }
  #card .row:hover { background: rgba(255,255,255,0.06); }
  #card .row .rdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  #card .row .rt { flex: 1; font-size: 12px; line-height: 1.3; }
  #card .row .ra { font-size: 10px; color: #8a92a8; font-family: "SF Mono", monospace; }
  #card .empty { font-size: 12px; color: #5a6278; padding: 12px; text-align: center; font-style: italic; }

  /* 加载状态 */
  #loading {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: #0a0d18; transition: opacity 0.4s;
    flex-direction: column; gap: 16px;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .spinner {
    width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #6b8cff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .msg { font-size: 13px; color: #8a92a8; }
  #loading .err { color: #ff6b6b; font-size: 12px; max-width: 480px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="msg" id="loadingMsg">加载知识图谱...</div>
</div>

<div id="wrap">
  <div id="cy-container" style="width:100%; height:100%;"></div>
</div>

<div class="header">
  <h1>中国基础教育知识图谱</h1>
  <div class="sub">Open Curriculum CN · 开源依赖关系图 · 来自 <a href="https://www.pep.com.cn/xw/zt/rjwy/yjkb2022/index.html" target="_blank" style="color:#6b8cff;text-decoration:none">2022 义教课标</a></div>
</div>

<div class="stats">
  <div>概念数: <b id="nCount">-</b></div>
  <div>关系数: <b id="eCount">-</b></div>
  <div>学科数: <b id="gCount">-</b></div>
</div>

<div class="legend" id="legend"></div>

<div id="tip">
  <span class="sw" id="tip-sw"></span>
  <span class="ts" id="tip-ts"></span>
  <div class="ttl" id="tip-ttl"></div>
  <div class="q" id="tip-q"></div>
</div>

<div id="card">
  <button class="close">×</button>
  <div class="head">
    <span class="sw" id="card-sw"></span>
    <span class="cs" id="card-cs"></span>
  </div>
  <div class="ctl" id="card-ctl"></div>
  <div class="cq" id="card-cq"></div>
  <div class="count" id="card-count">0</div>
  <div class="count-unit" id="card-unit">个先决概念</div>
  <div class="sub" id="card-sub"></div>
  <div class="sec sec-pre">
    <div class="label">直接先决 · <span class="k" id="card-pre-k">0</span></div>
    <div class="rows" id="card-pre-rows"></div>
  </div>
  <div class="sec sec-next">
    <div class="label">解锁后继 · <span class="k" id="card-next-k">0</span></div>
    <div class="rows" id="card-next-rows"></div>
  </div>
</div>

<script src="./cytoscape.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
